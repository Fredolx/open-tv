name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy (app)
        run: cargo clippy -p lily-tv -- -D warnings
      - name: Build release
        run: cargo build --release -p lily-tv
      - uses: actions/upload-artifact@v4
        with:
          name: lily-tv-windows
          path: target/release/lily-tv.exe
