[package]
name = "lily-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lily TV backend: sources, channel database, mpv playback, EPG, restream"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
directories = "6.0.0"
futures = "0.3.34"
if-addrs = "0.15.0"
indexmap = "2.14.2"
log = "0.4.35"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
regex = { version = "1.13.1", features = ["std"] }
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
url = "2.5.8"
warp = { version = "0.4.3", features = ["server"] }
which = "8.0.6"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
shell-words = "1.1.1"

[target.'cfg(target_os = "windows")'.dependencies]
winsplit = "0.1.0"
