[package]
name = "lily-tv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lily TV: a native IPTV player built with GPUI"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
gpui-kit = "0.9.0"
# Must match the GPUI snapshot gpui-kit 0.9.0 pins (gpui-pre =0.3.11)
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11" }
lily-core = { path = "../lily-core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

# Windows installer: fill packaging/deps (packaging/fetch-deps.ps1), then run
# `cargo packager --release` from this folder.
[package.metadata.packager]
product-name = "Lily TV"
identifier = "dev.lilytv.app"
publisher = "Lily TV"
before-packaging-command = "cargo build --release -p lily-tv"
out-dir = "../../target/release"
icons = ["assets/icon.ico"]
formats = ["nsis"]
# mpv/ffmpeg/yt-dlp are looked up in a deps folder next to the exe
resources = [{ src = "../../packaging/deps/*", target = "deps" }]
